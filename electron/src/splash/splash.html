<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSCP Desktop - Iniciando</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #0d1e34 0%, #070e18 100%);
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid rgba(14, 165, 233, 0.25);
      border-radius: 12px;
      -webkit-app-region: drag;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 30px;
      width: 100%;
    }

    .badge-icon {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(14, 165, 233, 0.4), 0 0 15px rgba(56, 189, 248, 0.3);
      margin-bottom: 22px;
      position: relative;
    }

    .badge-icon svg {
      width: 40px;
      height: 40px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #f8fafc;
      margin-bottom: 6px;
    }

    .tagline {
      font-size: 13px;
      font-weight: 400;
      color: #94a3b8;
      margin-bottom: 28px;
    }

    .pulse-container {
      width: 260px;
      height: 36px;
      position: relative;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pulse-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .pulse-path {
      stroke: #38bdf8;
      stroke-width: 2.5;
      fill: none;
      stroke-dasharray: 400;
      stroke-dashoffset: 400;
      animation: drawPulse 2.2s linear infinite;
      filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.8));
    }

    @keyframes drawPulse {
      0% {
        stroke-dashoffset: 400;
      }
      50% {
        stroke-dashoffset: 0;
      }
      100% {
        stroke-dashoffset: -400;
      }
    }

    .status-text {
      font-size: 12px;
      color: #38bdf8;
      font-weight: 500;
      letter-spacing: 0.3px;
      min-height: 18px;
      transition: all 0.3s ease;
    }

    .version-tag {
      position: absolute;
      bottom: 14px;
      font-size: 11px;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge-icon">
      <!-- Medical Stethoscope / Cross Icon -->
      <svg viewBox="0 0 24 24">
        <path d="M12 2v20M2 12h20" stroke-width="3" />
      </svg>
    </div>
    <h1 class="title">SSCP Desktop</h1>
    <p class="tagline">Sistema de Seguimiento para Consultas de Pacientes</p>
    
    <div class="pulse-container">
      <svg class="pulse-svg" viewBox="0 0 260 36">
        <path class="pulse-path" d="M0,18 L60,18 L75,4 L90,32 L105,12 L120,24 L135,18 L260,18" />
      </svg>
    </div>

    <div id="status" class="status-text">Iniciando entorno clínico seguro...</div>
  </div>
  <div class="version-tag">Electron v44.4 • Windows Native Core</div>

  <script>
    const messages = [
      "Iniciando entorno clínico seguro...",
      "Comprobando integridad de base de datos...",
      "Sincronizando servicios locales...",
      "Cargando módulos médicos...",
      "Listo. Abriendo ventana principal..."
    ];
    let idx = 0;
    const el = document.getElementById("status");
    setInterval(() => {
      if (idx < messages.length - 1) {
        idx++;
        el.textContent = messages[idx];
      }
    }, 900);
  </script>
</body>
</html>
