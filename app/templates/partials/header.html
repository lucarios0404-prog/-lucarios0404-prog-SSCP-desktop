<header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 z-10 shrink-0">
    <div class="flex items-center space-x-4">
        <h2 class="text-xl font-bold text-gray-800 tracking-tight">{% block header_title %}{{ page_title | default("SSCP Desktop") }}{% endblock %}</h2>
    </div>
    <div class="flex items-center space-x-4">
        <div class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200 shadow-sm">
            <span class="w-2 h-2 mr-1.5 bg-emerald-500 rounded-full animate-pulse"></span>
            Modo Local / Offline Activo
        </div>
        <a href="/logout" class="text-xs text-gray-500 hover:text-red-600 font-medium flex items-center px-3 py-1.5 rounded-md hover:bg-red-50 border border-gray-200 transition-colors">
            <i class="fas fa-sign-out-alt mr-1.5"></i> Salir
        </a>
    </div>
</header>
