{% extends "layouts/base.html" %}

{% block title %}Página no encontrada - SSCP{% endblock %}

{% block body %}
<div class="min-h-screen bg-slate-50 flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-200/80 p-8 text-center">
        <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-blue-100 shadow-inner">
            <i class="fas fa-search-location text-2xl"></i>
        </div>
        <h1 class="text-xl font-bold text-slate-900 mb-2">Registro o Página no Encontrada</h1>
        <p class="text-sm text-slate-500 mb-6 leading-relaxed">
            El recurso que intenta consultar no existe o ha sido reubicado.
        </p>

        <div class="flex flex-col sm:flex-row gap-3">
            <button onclick="window.history.back()" class="flex-1 px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-sm font-semibold transition-colors">
                <i class="fas fa-arrow-left mr-1.5"></i> Volver
            </button>
            <a href="/" class="flex-1 px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-semibold shadow-sm shadow-blue-500/30 transition-all inline-flex items-center justify-center">
                <i class="fas fa-home mr-1.5"></i> Ir al Panel
            </a>
        </div>
    </div>
</div>
{% endblock %}
