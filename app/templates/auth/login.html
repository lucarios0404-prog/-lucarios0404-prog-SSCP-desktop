{% extends "layouts/base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block body %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-xl shadow-lg">
        <div class="text-center">
            <div class="flex justify-center mb-3">
                <img src="/static/images/brand/logo-full-color.png" alt="SSCP" class="h-16 w-auto object-contain drop-shadow-sm">
            </div>
            <h2 class="text-center text-2xl font-black text-gray-900 tracking-tight">
                SSCP <span class="text-blue-600">Desktop</span>
            </h2>
            <p class="mt-1 text-center text-xs text-gray-500 font-medium">
                Sistema de Seguimiento para Consultas de Pacientes
            </p>
        </div>
        
        {% if error %}
        <div class="bg-red-50 border-l-4 border-red-400 p-4 mb-4">
            <div class="flex">
                <div class="flex-shrink-0">
                    <i class="fas fa-exclamation-circle text-red-400"></i>
                </div>
                <div class="ml-3">
                    <p class="text-sm text-red-700">{{ error }}</p>
                </div>
            </div>
        </div>
        {% endif %}

        <form class="mt-8 space-y-6" action="/login" method="POST">
            <div class="rounded-md shadow-sm -space-y-px">
                <div>
                    <label for="username" class="sr-only">Correo electrónico</label>
                    <input id="username" name="username" type="email" autocomplete="email" required class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-t-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm" placeholder="Correo electrónico">
                </div>
                <div>
                    <label for="password" class="sr-only">Contraseña</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-b-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm" placeholder="Contraseña">
                </div>
            </div>

            <div>
                <button type="submit" class="group relative w-full flex justify-center py-2.5 px-4 border border-transparent text-sm font-semibold rounded-lg text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 shadow-md shadow-blue-500/20 transition-all">
                    <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                        <i class="fas fa-sign-in-alt text-blue-300 group-hover:text-white"></i>
                    </span>
                    Iniciar Sesión
                </button>
            </div>
        </form>

        <!-- Acceso Rápido Demostración -->
        <div class="mt-6 pt-6 border-t border-gray-100">
            <p class="text-xs text-center font-bold text-gray-500 uppercase tracking-wider mb-3">
                Seleccionar Perfil para Demostración:
            </p>
            <div class="grid grid-cols-3 gap-2">
                <button type="button" onclick="setCredentials('admin@sscp.com', 'password123')" class="flex flex-col items-center p-2.5 rounded-lg border border-blue-200 bg-blue-50/50 hover:bg-blue-100/70 text-blue-700 transition-all text-xs group">
                    <i class="fas fa-shield-alt text-base mb-1 text-blue-600 group-hover:scale-110 transition-transform"></i>
                    <span class="font-bold">Admin</span>
                    <span class="text-[10px] text-gray-500">General</span>
                </button>
                <button type="button" onclick="setCredentials('doctor@sscp.com', 'password123')" class="flex flex-col items-center p-2.5 rounded-lg border border-emerald-200 bg-emerald-50/50 hover:bg-emerald-100/70 text-emerald-700 transition-all text-xs group">
                    <i class="fas fa-user-md text-base mb-1 text-emerald-600 group-hover:scale-110 transition-transform"></i>
                    <span class="font-bold">Médico</span>
                    <span class="text-[10px] text-gray-500">Clínica</span>
                </button>
                <button type="button" onclick="setCredentials('secretaria@sscp.com', 'password123')" class="flex flex-col items-center p-2.5 rounded-lg border border-amber-200 bg-amber-50/50 hover:bg-amber-100/70 text-amber-700 transition-all text-xs group">
                    <i class="fas fa-headset text-base mb-1 text-amber-600 group-hover:scale-110 transition-transform"></i>
                    <span class="font-bold">Secretaria</span>
                    <span class="text-[10px] text-gray-500">Recepción</span>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
function setCredentials(email, pass) {
    document.getElementById('username').value = email;
    document.getElementById('password').value = pass;
}
</script>
{% endblock %}
